<section id="contact-us">
    <div class="section-title">
        <h2>Contact Us</h2>

    </div>

    {% for contact in structures['contact'] %}
    <section class="tac-section">
        <div class="tac-block">
            <h3>{{ contact['sectionTitle'] }}</h3>
            {% set articleVar = contact['article'].split('/')[-1].split('.')[0] %}
            {{ articles[articleVar] }}

            <form action="https://formspree.io/f/xandalro" method="POST">
                <div class="tac-infos">
                    <label class="sr-only" for="tac-name">Name</label>
                    <input id="tac-name" type="text" class="tac-name skewed-block" b-role="block" placeholder="Name" name="Name" required>

                    <label class="sr-only" for="tac-email">Email</label>
                    <input id="tac-email" type="email" class="tac-email skewed-block" b-role="block" placeholder="Email" name="Email" required>
                </div>

                <label class="sr-only" for="tac-message">Message</label>
                <textarea id="tac-message" class="tac-message skewed-block" b-role="block" placeholder="Message" rows="7" name="Message" required></textarea>

                <input type="submit" value="Send" class="tac-send skewed-block" b-role="btn" b-hoverable>
            </form>
        </div>
    </section>
    {% endfor %}
</section>
