<button class="menu-btn skewed-block" type="button" b-role="btn" b-hoverable>
    <svg><use href="/assets/sprite.svg#svg-menu"></use></svg>
    <p>Menu</p>
</button>

<nav class="menu display-none">
    <div class="menu-bg"></div>

    <ul class="menu-wrapper">
        <ui>
            <button type="button" class="menu-close-btn skewed-block" b-role="btn" b-hoverable hover-text="Home">
                <svg width="1.6875rem"><use href="/assets/sprite.svg#svg-close"></use></svg>
            </button>
        </ui>

        <ui>
            <a href="/" class="menu-a skewed-block" b-role="btn" b-hoverable hover-text="Home">
                <svg><use href="/assets/sprite.svg#svg-home"></use></svg>
                <span>Home</span>
            </a>
        </ui>

        {% for section in pages['index']['structure'] %}
        {% if section.id %}
        <ui>
            <a href="{{ section.link }}" class="menu-a skewed-block" b-role="btn" b-hoverable hover-text="{{ section.title }}">
                <svg><use href="{{ section.icon }}"></use></svg>
                <span>{{ section.title }}</span>
            </a>
        </ui>
        {% endif %}
        {% endfor %}
    </ul>
</nav>
