<button class="menu-btn skewed-block" type="button" b-role="btn" b-hoverable aria-label="Open menu">
    {# P2·6 — decorative SVGs in menu marked aria-hidden so screen readers
       don't double-announce. The text label / aria-label is the
       accessible name for each control. #}
    <svg aria-hidden="true"><use href="/assets/sprite.svg#svg-menu"></use></svg>
    <p>Menu</p>
</button>

<nav class="menu display-none">
    <div class="menu-bg"></div>

    <ul class="menu-wrapper">
        <li>
            <button type="button" class="menu-close-btn skewed-block" b-role="btn" b-hoverable hover-text="Home" aria-label="Close menu">
                <svg width="1.6875rem" aria-hidden="true"><use href="/assets/sprite.svg#svg-close"></use></svg>
            </button>
        </li>

        <li>
            <a href="/#" class="menu-a skewed-block" b-role="btn" b-hoverable hover-text="Home">
                <svg aria-hidden="true"><use href="/assets/sprite.svg#svg-home"></use></svg>
                <span>Home</span>
            </a>
        </li>

        {% for section in pages['index']['structure'] %}
        {% if section.id %}
        <li>
            <a href="{{ section.link }}" class="menu-a skewed-block" b-role="btn" b-hoverable hover-text="{{ section.title }}">
                <svg aria-hidden="true"><use href="{{ section.icon }}"></use></svg>
                <span>{{ section.title }}</span>
            </a>
        </li>
        {% endif %}
        {% endfor %}
    </ul>
</nav>
