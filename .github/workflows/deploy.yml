name: Build and Deploy to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "source" branch
  push:
    branches: [ "source" ]
  pull_request:
    branches: [ "source" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run build script
        run: python build.py

      # Post-build gates: design-token invariants (CSS) and site audit
      # (dead links, anchors, h1/meta/canonical/alt) — a failure here
      # blocks the deploy instead of shipping a regression.
      - name: Validate design tokens
        run: python validate_design_tokens.py

      - name: Audit built site
        run: python validate_site.py

      # Deploy the build folder to the gh-pages branch.
      # Skipped on pull_request runs so open PRs only build as a CI check
      # without overwriting the live site; deploys only fire after merge to source.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/source'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          # This token is provided by Actions, you do not need to create your own token
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # The branch you want to deploy to.
          publish_branch: gh-pages
          publish_dir: ./docs